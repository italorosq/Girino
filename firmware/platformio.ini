; Girino — Plataforma didática de controle de motor DC
; LaRA — Laboratório de Robótica e Automação

[platformio]
default_envs = girino

; --- Configuração de ambiente ---
[env:girino]
platform = espressif8266@4.2.1
board = esp12e
framework = arduino

; --- Monitor e Upload ---
; Monitor serial
monitor_speed = 115200
monitor_filters = esp8266_exception_decoder

; Velocidade de upload
upload_speed = 921600

; --- Definições de compilação e Credenciais ---
; Criar arquivo .env na pasta firmware/ com:
;   WIFI_SSID="sua_rede"
;   WIFI_PASSWORD="sua_senha"
;   OTA_PASSWORD="senha_ota"
; As credenciais são lidas por scripts/load_env.py (extra_scripts)
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DBAUD_RATE=115200

extra_scripts = pre:scripts/load_env.py

; --- Dependências ---
lib_deps =
    ayushsharma82/ElegantOTA@^3.1.5

; --- Partições OTA ---
; Usar partição com espaço para OTA (duas imagens de firmware)
board_build.filesystem = littlefs
; board_build.ldscript = eagle.flash.4m3m.ld  ; Descomentar para flash de 4MB
